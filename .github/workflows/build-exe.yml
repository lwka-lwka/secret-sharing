name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: python -m pip install streamlit pandas pyinstaller

      - name: 打包成 exe
        run: >
          pyinstaller --noconfirm --onefile --name SecretSharing
          --collect-all streamlit --copy-metadata streamlit
          --add-data "secret_sharing.py;."
          run_app.py

      - name: 測試 exe 能否正常啟動
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\SecretSharing.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8501/_stcore/health" -UseBasicParsing -TimeoutSec 3
              if ($r.Content -match "ok") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process SecretSharing -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Error "exe 沒有成功啟動網頁伺服器"; exit 1 }
          Write-Host "exe 啟動成功"

      - uses: actions/upload-artifact@v4
        with:
          name: SecretSharing-exe
          path: dist/SecretSharing.exe
