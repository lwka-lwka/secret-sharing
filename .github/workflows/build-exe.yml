name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: python -m pip install streamlit pandas numpy pillow pyinstaller

      - name: 打包 key 版 exe
        run: >
          pyinstaller --noconfirm --onefile --name SecretSharing
          --collect-all streamlit --recursive-copy-metadata streamlit
          --add-data "secret_sharing.py;."
          run_app.py

      - name: 打包影像版 exe
        run: >
          pyinstaller --noconfirm --onefile --name SecretImageSharing
          --collect-all streamlit --recursive-copy-metadata streamlit
          --add-data "image_sharing.py;."
          run_image_app.py

      - name: 測試兩個 exe 能否正常啟動
        shell: pwsh
        run: |
          $env:NO_BROWSER = "1"
          function Test-Exe($name, $port) {
            $proc = Start-Process -FilePath "dist\$name.exe" -PassThru -NoNewWindow `
                    -RedirectStandardOutput "$name-out.txt" -RedirectStandardError "$name-err.txt"
            $ok = $false
            for ($i = 0; $i -lt 100; $i++) {
              Start-Sleep -Seconds 3
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -Uri "http://localhost:$port/_stcore/health" -UseBasicParsing -TimeoutSec 3
                if ($r.Content -match "ok") { $ok = $true; break }
              } catch {}
            }
            Get-Process $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Write-Host "===== $name 的輸出 ====="
            if (Test-Path "$name-out.txt") { Get-Content "$name-out.txt" | Out-Host }
            if (Test-Path "$name-err.txt") { Get-Content "$name-err.txt" | Out-Host }
            if ($ok) { Write-Host "$name 啟動成功" } else { Write-Host "$name 沒有成功啟動網頁伺服器" }
            return $ok
          }
          $a = Test-Exe "SecretSharing" 8501
          $b = Test-Exe "SecretImageSharing" 8502
          if (-not ($a -and $b)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SecretSharing-exe
          path: |
            dist/SecretSharing.exe
            dist/SecretImageSharing.exe
